    order: 1
    intent: 上门直接开口要钱
    speakerRole: lender
  - id: b2
    order: 2
    intent: 表哥打太极，说最近手头紧
    speakerRole: kin
  - id: b3
    order: 3
    intent: 翻旧账——当初借的时候怎么说的
    speakerRole: lender
  - id: b4
    order: 4
    intent: 表哥反咬，拿亲戚情分压人
    speakerRole: kin
  - id: b5
    order: 5
    intent: 彻底撕破脸
    speakerRole: lender
  - id: b6
    order: 6
    intent: 门关上，谁也没赢
    speakerRole: none
