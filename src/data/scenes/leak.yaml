id: leak
title: 楼上又漏了
situation: 天花板洇出一大片水印，第三回了。拎着拖把上楼砸门。

# 邻里吵架是脏话密度最高的场景之一——不是为了脏而脏，是这种场合本来就不客气。
# 一方憋了三次的火，一方从装糊涂到反咬，两边都上头。
