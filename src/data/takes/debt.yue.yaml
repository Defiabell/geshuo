id: debt.yue
sceneId: debt
dialectId: yue
source: tts
verification: unverified
lines:
  - beatId: b1
    textDialect: 阿哥…… 喺屋企啊？嗰個…… 我今日嚟係…… 唉，就係嗰笔钱。两年啦噃。你睇你几时…… 我唔係逼你啊，真係唔係逼你，就係我呢边都真係要用。
    textMandarin: 哥…… 在家吗？那个…… 我今天来是…… 唉，就是那笔钱。两年了。你看你什么时候…… 我不是逼你啊，真不是逼你，就是我这边真的要用。
    note: 嗰＝那，几时＝什么时候，唔係＝不是，呢边＝这边。开口还留着面子。
    audio: /audio/debt.yue/b1.mp3
    durationMs: 19280
  - beatId: b2
    textDialect: 哎呀阿妹，你点解嚟咗嘅？入嚟坐入嚟坐。…… 啊嗰笔钱啊，嗰個，我知我知。我呢排真係紧，你唔知我呢边…… 唉。等我唞过啖气，实还你嘅，走唔甩，走唔甩。
    textMandarin: 哎呀妹妹，你怎么来了？进来坐进来坐。…… 啊那笔钱啊，那个，我知道我知道。我这阵子真的紧，你不知道我这边……
      唉。等我缓过这口气，一定还你，跑不了，跑不了。
    note: 睇＝看，呢排＝最近，唞＝喘/歇，啖＝口（量词），实＝一定，走唔甩＝跑不掉。
    audio: /audio/debt.yue/b2.mp3
    durationMs: 17920
  - beatId: b3
    textDialect: 唞？你重唞？两年前你就係噉讲，一模一样！你当初借嗰阵点讲嘅？拍晒心口，三个月！三个月啊！你而家同我讲唞？你当我记性差係咪？
    textMandarin: 缓？你还缓？两年前你就是这么说的，一模一样！你当初借的时候怎么说的？拍着胸口，三个月！三个月啊！你现在跟我说缓？你当我记性差是吗？
    note: 噉讲＝这么说，嗰阵＝那时候，拍晒心口＝拍着胸脯，晒是完成/尽的意思。
    audio: /audio/debt.yue/b3.mp3
    durationMs: 15280
  - beatId: b4
    textDialect: 哎你使唔使咁啊？…… 咁少少嘢。啊？我哋边个同边个啊，一家人。为咗咁少少钱，你喺我门口噉嘈，你都唔怕丑。
    textMandarin: 哎你至于吗？…… 这么点事。啊？咱俩谁跟谁，一家人。为这么点钱，你在我门口这么吵，你也不害臊。
    note: 使唔使咁＝至于吗，少少嘢＝一点点事，喺度＝在这儿，嘈＝吵，怕丑＝害臊。
    audio: /audio/debt.yue/b4.mp3
    durationMs: 9360
  - beatId: b5
    textDialect: 两个钱？…… 两个钱？！八万蚊！你叫八万蚊做两个钱？！你个扑街，欠钱重有埋道理係咪？得。得得得。听日，听日我就将呢张借据贴你楼下，睇下边个怕丑！
    textMandarin: 两个钱？…… 两个钱？！八万块！你把八万块叫两个钱？！你这扑街，欠钱还有理了是吗？行。行行行。明天，明天我就把这张借条贴你楼下，看谁害臊！
    note: 蚊＝块（钱），仲＝还，有埋＝连…都有，听日＝明天，边个＝谁。
    audio: /audio/debt.yue/b5.mp3
    durationMs: 13520
  - beatId: b6
    textDialect: ——
    textMandarin: 门关上。谁也没赢。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
