id: debt.yue
sceneId: debt
dialectId: yue
source: tts
verification: unverified
lines:
  - beatId: b1
    textDialect: 阿哥…… 嗰笔钱啊。两年啦，你几时…… 我唔係逼你啊，就係我呢边真係要用。
    textMandarin: 哥…… 那笔钱。两年了，你什么时候…… 我不是逼你，就是我这边真的要用。
    note: 嗰＝那，几时＝什么时候，唔係＝不是，呢边＝这边。开口还留着面子。
    audio: /audio/debt.yue/b1.mp3
    durationMs: 7840
  - beatId: b2
    textDialect: 哎呀阿妹，我知我知。呢排手头真係紧，等我唞过啖气，实还你，走唔甩。
    textMandarin: 哎呀妹妹，我知道我知道。这阵子手头真的紧，等我缓过这口气，一定还你，跑不了。
    note: 睇＝看，呢排＝最近，唞＝喘/歇，啖＝口（量词），实＝一定，走唔甩＝跑不掉。
    audio: /audio/debt.yue/b2.mp3
    durationMs: 5840
  - beatId: b3
    textDialect: 唞？两年前你就係噉讲！当初借嗰阵拍晒心口话三个月，三个月啊！你当我记性差係咪？
    textMandarin: 缓？两年前你就是这么说的！当初借的时候拍着胸口说三个月，三个月啊！你当我记性差是吗？
    note: 噉讲＝这么说，嗰阵＝那时候，拍晒心口＝拍着胸脯，晒是完成/尽的意思。
    audio: /audio/debt.yue/b3.mp3
    durationMs: 8480
  - beatId: b4
    textDialect: 你使唔使咁啊？咁少少嘢。一家人嚟嘅，为咗呢啲钱喺我门口嘈，你都唔怕丑。
    textMandarin: 你至于吗？这么点事。一家人，为这点钱在我门口吵，你也不害臊。
    note: 使唔使咁＝至于吗，少少嘢＝一点点事，喺度＝在这儿，嘈＝吵，怕丑＝害臊。
    audio: /audio/debt.yue/b4.mp3
    durationMs: 7440
  - beatId: b5
    textDialect: 两个钱？八万蚊你叫两个钱？！你个扑街，欠钱重有埋道理。得，听日我就将张借据贴喺你楼下，睇下边个怕丑！
    textMandarin: 两个钱？八万块你叫两个钱？！你这扑街，欠钱还有理了。行，明天我就把借条贴在你楼下，看谁害臊！
    note: 蚊＝块（钱），仲＝还，有埋＝连…都有，听日＝明天，边个＝谁。
    audio: /audio/debt.yue/b5.mp3
    durationMs: 9600
  - beatId: b6
    textDialect: ——
    textMandarin: 门关上。谁也没赢。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
