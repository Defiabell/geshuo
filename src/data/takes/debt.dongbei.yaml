id: debt.dongbei
sceneId: debt
dialectId: dongbei
source: tts
verification: unverified
lines:
  - beatId: b1
    textDialect: 哥…… 那钱儿。俩年了，你啥时候…… 我不是催你啊，就我这边儿是真等着用。
    textMandarin: 哥…… 那笔钱。两年了，你什么时候…… 我不是催你，就我这边是真等着用。
    note: 东北官话与普通话最接近，这一拍几乎重合——差异要到后面上火了才显出来。
    audio: /audio/debt.dongbei/b1.mp3
    durationMs: 7656
  - beatId: b2
    textDialect: 哎呀妹子，我知道我知道。这阵儿手头是真紧，等我缓过这口气儿，肯定还你，跑不了。
    textMandarin: 哎呀妹妹，我知道我知道。这阵子手头是真紧，等我缓过这口气，肯定还你，跑不了。
    note: 句末「紧的」不接宾语，是东北话把形容词摊开说的习惯。
    audio: /audio/debt.dongbei/b2.mp3
    durationMs: 7800
  - beatId: b3
    textDialect: 缓？俩年前你就这么说的！当初借的时候拍胸脯说仨月，仨月！你拿我当傻子涮呢？
    textMandarin: 缓？两年前你就这么说的！当初借的时候拍着胸脯说三个月，三个月！你拿我当傻子耍呢？
    note: 涮＝耍弄。句末「呢」是东北官话质问句的常见收尾。
    audio: /audio/debt.dongbei/b3.mp3
    durationMs: 7728
  - beatId: b4
    textDialect: 你至于不？多大点事儿。都是一家人，为这点钱在我门口咋呼，你也不嫌寒碜。
    textMandarin: 你至于吗？多大点事。都是一家人，为这点钱在我门口嚷嚷，你也不嫌丢人。
    note: 扯犊子＝废话/胡扯，寒碜＝丢人。这两个词几乎是东北话的身份证。
    audio: /audio/debt.dongbei/b4.mp3
    durationMs: 6264
  - beatId: b5
    textDialect: 俩钱儿？八万你管这叫俩钱儿？！你个王八犊子，欠钱还欠出理来了。行，明儿我就把借条贴你单元门上，看谁寒碜！
    textMandarin: 两个钱？八万你管这叫两个钱？！你这王八蛋，欠钱还欠出理来了。行，明天我就把借条贴你单元门上，看谁丢人！
    note: 「王八犊子」比「瘪犊子」重一档，撕破脸才会用。
    audio: /audio/debt.dongbei/b5.mp3
    durationMs: 9648
  - beatId: b6
    textDialect: ——
    textMandarin: 门关上。谁也没赢。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
