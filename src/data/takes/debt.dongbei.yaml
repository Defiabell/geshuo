id: debt.dongbei
sceneId: debt
dialectId: dongbei
source: tts
verification: unverified
lines:
  - beatId: b1
    textDialect: 哥…… 在家呢？那什么…… 我今儿来是…… 嗐，就那钱儿。俩年了都。你看你啥时候…… 我不是催啊，真不是催，就我这边儿是真等着用。
    textMandarin: 哥…… 在家吗？那什么…… 我今天来是…… 唉，就那笔钱。两年了。你看你什么时候…… 我不是催啊，真不是催，就我这边是真等着用。
    note: 东北官话与普通话最接近，这一拍几乎重合——差异要到后面上火了才显出来。
    audio: /audio/debt.dongbei/b1.mp3
    durationMs: 13176
  - beatId: b2
    textDialect: 哎呀妹子，你咋来了呢？快进屋进屋。…… 啊那钱啊，那个，我知道我知道。我这阵儿是真紧，你不知道我这……
      唉。等我缓过这口气儿，肯定的事儿，跑不了，跑不了。
    textMandarin: 哎呀妹妹，你怎么来了？快进屋进屋。…… 啊那笔钱啊，那个，我知道我知道。我这阵子是真紧，你不知道我这……
      唉。等我缓过这口气，肯定的事，跑不了，跑不了。
    note: 句末「紧的」不接宾语，是东北话把形容词摊开说的习惯。
    audio: /audio/debt.dongbei/b2.mp3
    durationMs: 13392
  - beatId: b3
    textDialect: 缓？你还缓？俩年前你就这么说的，一模一样！你当初借的时候咋说的？拍着胸脯，仨月！仨月啊！你现在跟我说缓？你拿我当傻子涮呢？
    textMandarin: 缓？你还缓？两年前你就这么说的，一模一样！你当初借的时候怎么说的？拍着胸脯，三个月！三个月啊！你现在跟我说缓？你拿我当傻子耍呢？
    note: 涮＝耍弄。句末「呢」是东北官话质问句的常见收尾。
    audio: /audio/debt.dongbei/b3.mp3
    durationMs: 14448
  - beatId: b4
    textDialect: 哎你至于不至于啊？…… 多大点事儿。啊？咱俩谁跟谁，一家人。为这么俩钱儿，你在我家门口这么咋呼，你也不嫌寒碜。
    textMandarin: 哎你至于吗？…… 多大点事。啊？咱俩谁跟谁，一家人。为这么点钱，你在我家门口这么嚷嚷，你也不嫌丢人。
    note: 扯犊子＝废话/胡扯，寒碜＝丢人。这两个词几乎是东北话的身份证。
    audio: /audio/debt.dongbei/b4.mp3
    durationMs: 9480
  - beatId: b5
    textDialect: 俩钱儿？…… 俩钱儿？！八万！你管八万叫俩钱儿？！你个王八犊子，欠钱还欠出理来了是吧？行。行行行。明儿，明儿我就把这借条给你贴单元门上，咱看谁寒碜！
    textMandarin: 两个钱？…… 两个钱？！八万！你管八万叫两个钱？！你这王八蛋，欠钱还欠出理来了是吧？行。行行行。明天，明天我就把这借条给你贴单元门上，咱看谁丢人！
    note: 「王八犊子」比「瘪犊子」重一档，撕破脸才会用。
    audio: /audio/debt.dongbei/b5.mp3
    durationMs: 13344
  - beatId: b6
    textDialect: ——
    textMandarin: 门关上。谁也没赢。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
