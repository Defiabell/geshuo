id: debt.chengyu
sceneId: debt
dialectId: chengyu
source: tts
verification: unverified
lines:
  - beatId: b1
    textDialect: 哥…… 在屋头嘛？那个…… 我今天来是…… 嗨，就那个钱。两年咯嘛。你看你啥子时候…… 我不是催哈，真的不是催，就是我这头儿实在是要用。
    textMandarin: 哥…… 在家吗？那个…… 我今天来是…… 唉，就那笔钱。两年了。你看你什么时候…… 我不是催啊，真不是催，就是我这边实在要用。
    note: 啥子时候＝什么时候，等到用＝等着用。句末「嘛」把话说软，还没撕破脸。
    audio: /audio/debt.chengyu/b1.mp3
    durationMs: 14240
  - beatId: b2
    textDialect: 哎呀妹儿，你咋个来咯？进来坐嘛进来坐。…… 哦那个钱嘛，那个，我晓得我晓得。我这阵子是真紧，你不晓得我这……
      唉。等我缓过这口气，肯定还你噻，跑不脱，跑不脱。
    textMandarin: 哎呀妹妹，你怎么来了？进来坐进来坐。…… 哦那笔钱啊，那个，我知道我知道。我这阵子是真紧，你不知道我这……
      唉。等我缓过这口气，肯定还你，跑不了，跑不了。
    note: 紧得很＝很紧（川渝把程度补语放句末），跑不脱＝跑不掉。
    audio: /audio/debt.chengyu/b2.mp3
    durationMs: 18080
  - beatId: b3
    textDialect: 缓？你还缓？两年前你就是这个话，一模一样！你当初借的时候咋个说的？拍起胸口，三个月！三个月哦！你现在跟我说缓？你当我脑壳有包啊？
    textMandarin: 缓？你还缓？两年前你就是这套说辞，一模一样！你当初借的时候怎么说的？拍着胸口，三个月！三个月啊！你现在跟我说缓？你当我傻吗？
    note: 拍起＝拍着，「脑壳有包」＝脑子有毛病，是川渝极高频的一句损人话。
    audio: /audio/debt.chengyu/b3.mp3
    durationMs: 11440
  - beatId: b4
    textDialect: 哎你至于不嘛？…… 多大点事儿。啊？我们两个哪个跟哪个，一家人。为倒这么点钱，你在我门口这么吼，你也不嫌丢人。
    textMandarin: 哎你至于吗？…… 多大点事。啊？咱俩谁跟谁，一家人。为这么点钱，你在我门口这么嚷，你也不嫌丢人。
    note: 为倒＝为了（倒是川渝的持续体标记，相当于「着」）。
    audio: /audio/debt.chengyu/b4.mp3
    durationMs: 11920
  - beatId: b5
    textDialect: 两个钱？……
      两个钱？！八万块！你把八万块叫两个钱？！你个龟儿，欠钱还欠出理来了是不是？要得。要得要得。明天，明天我就把这借条给你贴到单元门上，看哪个丢人！
    textMandarin: 两个钱？……
      两个钱？！八万块！你把八万块叫两个钱？！你这王八蛋，欠钱还欠出理来了是不是？行。行行行。明天，明天我就把这借条给你贴到单元门上，看谁丢人！
    note: 要得＝行，哪个＝谁。「龟儿」在这一拍是真骂，不是语气词。
    audio: /audio/debt.chengyu/b5.mp3
    durationMs: 12560
  - beatId: b6
    textDialect: ——
    textMandarin: 门关上。谁也没赢。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
