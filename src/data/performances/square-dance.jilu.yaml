lines:
  - beatId: b1
    textDialect: 大姨，都九点半了，音响关小点儿行不行？俺家孩儿明儿还上学呢。
    textMandarin: 大姨，都九点半了，音响关小点行不行？我家孩子明天还上学呢。
    note: 大姨＝对中老年女性的常见称呼，孩儿＝孩子，明儿＝明天。开口还客气，所以不带脏字。
    audio: /audio/square-dance.jilu/b1.mp3
    durationMs: 6936
  - beatId: b2
    textDialect: 这是公共地界儿，俺们跳俺们的，碍着恁么事了？
    textMandarin: 这是公共场所，我们跳我们的，碍着你什么事了？
    note: 地界儿＝地方/场所，么事＝什么事。「碍着恁么事了」在冀鲁官话里是标准的顶人句式。
    audio: /audio/square-dance.jilu/b2.mp3
    durationMs: 3816
  - beatId: b3
    textDialect: 公共地界儿也有个点儿吧？十点以后扰民是犯法的，恁不知道？
    textMandarin: 公共场所也得有个时间吧？十点以后扰民是犯法的，你不知道？
    note: 有个点儿＝有个时间界限。搬规定这一拍各地都从方言退回半步，因为在讲道理。
    audio: /audio/square-dance.jilu/b3.mp3
    durationMs: 6864
  - beatId: b4
    textDialect: 哟，还给俺讲上法了？俺们老太太锻炼身体碍着谁了？恁年纪轻轻火气恁大！
    textMandarin: 哟，还跟我讲起法律了？我们老太太锻炼身体碍着谁了？你年纪轻轻火气这么大！
    note: 恁大＝这么大（恁在冀鲁官话里既是「你」也是「这么」，此处是后者）。
    audio: /audio/square-dance.jilu/b4.mp3
    durationMs: 6456
  - beatId: b5
    textDialect: 行，恁接着跳。俺这就打一一〇，看是恁音响响还是警车响。
    textMandarin: 行，你们接着跳。我这就打110，看是你音响响还是警车响。
    note: 最狠的话反而最平——北方吵架的规律，要动真格的时候不骂了。
    audio: /audio/square-dance.jilu/b5.mp3
    durationMs: 7176
  - beatId: b6
    textDialect: ——
    textMandarin: 音乐没停，反而更大声了。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
