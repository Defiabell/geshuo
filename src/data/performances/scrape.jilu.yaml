sceneId: scrape
dialectId: jilu
source: tts
verification: unverified
lines:
  - beatId: b1
    textDialect: 你他娘的会不会开车？变道不打灯，恁那俩眼是出气的？
    textMandarin: 你他妈的会不会开车？变道不打灯，你那两只眼睛是用来出气的？
    note: 恁＝你/你们。「眼是出气的」是北方骂人不长眼的固定说法，比直说「瞎」更损。
    audio: /audio/scrape.jilu/b1.mp3
    durationMs: 6288
  - beatId: b2
    textDialect: 咋着？俺早就在这道上跑着了，是恁自己往上贴的，别赖俺。
    textMandarin: 怎么？我早就在这条道上开着了，是你自己贴上来的，别赖我。
    note: 咋着＝怎么样（挑衅式反问），跑着＝开着。冀鲁官话里「咋着」一出口就是要吵。
    audio: /audio/scrape.jilu/b2.mp3
    durationMs: 5016
  - beatId: b3
    textDialect: 别扯了，俺车上记录仪拍着呢，一调出来看谁没理。
    textMandarin: 别胡扯了，我车上行车记录仪拍着呢，一调出来看谁没理。
    note: 这一拍各地都平，因为讲证据的时候人反而冷静，方言差异集中在语气词上。
    audio: /audio/scrape.jilu/b3.mp3
    durationMs: 6048
  - beatId: b4
    textDialect: 拍着又咋着？有本事恁报警去啊，俺还怕恁不成？
    textMandarin: 拍着又怎么样？有本事你报警去啊，我还怕你不成？
    note: 「又咋着」是把上一句原样顶回去，吵架里最常见的结构。
    audio: /audio/scrape.jilu/b4.mp3
    durationMs: 4608
  - beatId: b5
    textDialect: 报就报！俺今儿个还就不走了，看恁个熊玩意儿能耗到多咱！
    textMandarin: 报就报！我今天还就不走了，看你这混账东西能耗到什么时候！
    note: 多咱＝什么时候，熊玩意儿＝冀鲁官话最常用的骂人话。今儿个＝今天。
    audio: /audio/scrape.jilu/b5.mp3
    durationMs: 5976
  - beatId: b6
    textDialect: ——
    textMandarin: 后面的喇叭响成一片。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
