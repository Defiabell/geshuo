id: leak.jilu
sceneId: leak
dialectId: jilu
source: tts
verification: unverified
lines:
  - beatId: b1
    textDialect: 开门！恁家又他娘的漏了！俺屋里棚顶淌得跟下雨似的，恁个熊玩意儿装死是吧？
    textMandarin: 开门！你家又漏水了！我屋里天花板淌得跟下雨一样，你这混账东西装死是吧？
    note: 恁＝你/你们，棚顶＝天花板。「熊玩意儿」是冀鲁官话骂人最常用的一句，火气不算最大，但轻蔑感很足。
    audio: /audio/leak.jilu/b1.mp3
    durationMs: 9408
  - beatId: b2
    textDialect: 漏么水啊？俺家好好儿的，一滴不漏。是不是恁自个儿弄的赖俺头上？
    textMandarin: 漏什么水啊？我家好好的，一滴不漏。是不是你自己弄的赖我头上？
    note: 么＝什么，自个儿＝自己。装糊涂这一拍各地都平淡，差异主要在疑问词。
    audio: /audio/leak.jilu/b2.mp3
    durationMs: 5736
  - beatId: b3
    textDialect: 上回就这么说的！说修说修，仨月了修个屁！恁那嘴是不是拿浆糊糊的？
    textMandarin: 上次就这么说的！说修说修，三个月了修个屁！你那嘴是不是拿浆糊糊的？
    note: 仨月＝三个月。「拿浆糊糊的」形容说话不算数，是北方话里很常见的骂法。
    audio: /audio/leak.jilu/b3.mp3
    durationMs: 7728
  - beatId: b4
    textDialect: 哎哟你这人咋这么不讲理！保不齐是恁自个儿防水没做好，操，赖上俺了是吧！
    textMandarin: 哎哟你这人怎么这么不讲理！说不定是你自己防水没做好，赖上我了是吧！
    note: 保不齐＝说不定。反咬这一拍开始带脏字，因为已经被戳穿了。
    audio: /audio/leak.jilu/b4.mp3
    durationMs: 6288
  - beatId: b5
    textDialect: 行，恁牛。这事儿不跟恁扯了，物业、法院随便挑，看最后谁难看！
    textMandarin: 行，你厉害。这事我不跟你争了，物业、法院随便挑，看最后谁难看！
    note: 撕破脸反而不骂了——北方吵架的规律是最狠的话往往最平，因为那是要动真格的。
    audio: /audio/leak.jilu/b5.mp3
    durationMs: 7656
  - beatId: b6
    textDialect: ——
    textMandarin: 门摔上。楼道里只剩回声。
    note: 骨架里保留一个空拍。所有方言的沉默都一样。
